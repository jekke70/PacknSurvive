<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#245a36" />
      <stop offset="55%" stop-color="#163e24" />
      <stop offset="100%" stop-color="#0b2314" />
    </radialGradient>

    <!-- Warm Golden Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Campervan Gradient -->
    <linearGradient id="camperBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Window Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Backpack Gradient -->
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Wheel Rim Gradient -->
    <radialGradient id="rimGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Forest Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3" />

  <!-- Twinkling Adventure Stars -->
  <g fill="#fef08a" opacity="0.85">
    <circle cx="85" cy="115" r="2.5" />
    <circle cx="130" cy="85" r="3" />
    <circle cx="215" cy="72" r="2" />
    <circle cx="430" cy="120" r="2.8" />
    <circle cx="395" cy="65" r="2.2" />
    <circle cx="95" cy="195" r="2" />
    <!-- Small star cross -->
    <path d="M410 160 L412 165 L417 167 L412 169 L410 174 L408 169 L403 167 L408 165 Z" fill="#fde047" opacity="0.9" />
  </g>

  <!-- Warm Golden Morning Sun in Upper Sky -->
  <circle cx="360" cy="130" r="58" fill="url(#sunGlow)" />
  <circle cx="360" cy="130" r="32" fill="#fbbf24" />
  <circle cx="360" cy="130" r="24" fill="#fef08a" />

  <!-- Iconic Compass Star (Adventure Motif) -->
  <g transform="translate(130, 130) scale(0.9)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="26" fill="rgba(11,35,20,0.55)" stroke="#fbbf24" stroke-width="2" />
    <!-- 4 points -->
    <polygon points="0,-22 5,-4 0,0" fill="#fef08a" />
    <polygon points="0,-22 -5,-4 0,0" fill="#d97706" />
    <polygon points="22,0 4,5 0,0" fill="#fef08a" />
    <polygon points="22,0 4,-5 0,0" fill="#d97706" />
    <polygon points="0,22 -5,4 0,0" fill="#fef08a" />
    <polygon points="0,22 5,4 0,0" fill="#d97706" />
    <polygon points="-22,0 -4,-5 0,0" fill="#fef08a" />
    <polygon points="-22,0 -4,5 0,0" fill="#d97706" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Layer 1: Distant Pine Hills Silhouette -->
  <path d="M-10 375 L30 335 L55 355 L90 320 L125 350 L170 310 L210 345 L255 315 L300 350 L345 310 L385 340 L430 305 L475 345 L522 315 L522 512 L-10 512 Z" fill="#0d2817" opacity="0.75" />

  <!-- Layer 2: Midground Pine Trees & Meadow -->
  <path d="M-10 405 Q90 380 200 395 T420 385 Q470 385 522 400 L522 512 L-10 512 Z" fill="#143c22" />
  <polygon points="60,400 45,340 75,340" fill="#0b2414" />
  <polygon points="60,350 50,305 70,305" fill="#0b2414" />
  <polygon points="60,315 54,280 66,280" fill="#0b2414" />

  <polygon points="440,395 425,335 455,335" fill="#0b2414" />
  <polygon points="440,345 430,300 450,300" fill="#0b2414" />
  <polygon points="440,310 434,275 446,275" fill="#0b2414" />

  <!-- Warm Ground / Campsite Terrain -->
  <ellipse cx="256" cy="425" rx="210" ry="46" fill="#1b4d2c" />
  <ellipse cx="256" cy="432" rx="175" ry="32" fill="#0f2e1a" opacity="0.8" />

  <!-- Campervan Main Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Campervan Ground Shadow -->
    <ellipse cx="245" cy="402" rx="145" ry="14" fill="#05140b" opacity="0.65" />

    <!-- REAR LADDER & SPARE TIRE -->
    <rect x="94" y="275" width="6" height="85" rx="3" fill="#64748b" />
    <line x1="94" y1="290" x2="108" y2="290" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="94" y1="310" x2="108" y2="310" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="94" y1="330" x2="108" y2="330" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- ROOF RACK & EXPEDITION GEAR -->
    <!-- Rack rails -->
    <rect x="120" y="224" width="190" height="7" rx="3" fill="#334155" />
    <rect x="135" y="231" width="6" height="12" fill="#334155" />
    <rect x="210" y="231" width="6" height="12" fill="#334155" />
    <rect x="290" y="231" width="6" height="12" fill="#334155" />

    <!-- Tied roof luggage / duffel / kayak -->
    <!-- Blue expedition crate -->
    <rect x="130" y="208" width="46" height="18" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
    <!-- Orange rolled mattress / sleeping bag -->
    <rect x="182" y="206" width="58" height="20" rx="9" fill="#ea580c" />
    <line x1="195" y1="206" x2="195" y2="226" stroke="#fff" stroke-width="2" opacity="0.6" />
    <line x1="225" y1="206" x2="225" y2="226" stroke="#fff" stroke-width="2" opacity="0.6" />
    <!-- Yellow Pelican box -->
    <rect x="246" y="210" width="52" height="16" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Cargo tie-down strap -->
    <path d="M126 226 Q215 198 304 226" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6,3" />

    <!-- CAMPERVAN BODY -->
    <!-- Aerodynamic high-roof plåtis chassis -->
    <path d="
      M 110 372
      L 106 270
      C 106 250, 118 240, 138 238
      L 295 238
      C 325 240, 345 255, 362 282
      L 384 322
      C 392 336, 392 355, 388 372
      Z
    " fill="url(#camperBody)" stroke="#cbd5e1" stroke-width="2.5" />

    <!-- Bumper & lower trim (dark rugged rock guard) -->
    <path d="
      M 106 352
      L 390 352
      C 392 360, 390 372, 386 376
      L 110 376
      C 107 372, 106 362, 106 352
      Z
    " fill="#1e293b" />

    <!-- SPORT ADVENTURE STRIPES -->
    <!-- Forest stripe -->
    <path d="M 106 332 L 382 332 L 384 340 L 106 340 Z" fill="#15803d" />
    <!-- Golden amber accent stripe -->
    <path d="M 106 341 L 385 341 L 387 347 L 106 347 Z" fill="#f59e0b" />

    <!-- WINDOWS -->
    <!-- Front Windshield -->
    <path d="
      M 314 252
      L 348 252
      C 358 262, 368 280, 374 304
      L 322 304
      C 320 280, 318 264, 314 252
      Z
    " fill="url(#glassGrad)" stroke="#0f172a" stroke-width="2" />
    <!-- Windshield Reflection Highlight -->
    <path d="M 330 256 L 344 256 L 360 300 L 346 300 Z" fill="#ffffff" opacity="0.35" />

    <!-- Mid Side Living Window -->
    <rect x="225" y="254" width="76" height="48" rx="8" fill="url(#glassGrad)" stroke="#0f172a" stroke-width="2" />
    <!-- Window highlight -->
    <polygon points="230,256 248,256 238,300 220,300" fill="#ffffff" opacity="0.25" />
    <circle cx="263" cy="278" r="3" fill="#ffffff" opacity="0.7" />

    <!-- Rear Bedroom Window -->
    <rect x="124" y="256" width="85" height="46" rx="8" fill="url(#glassGrad)" stroke="#0f172a" stroke-width="2" />
    <polygon points="130,258 146,258 138,300 122,300" fill="#ffffff" opacity="0.25" />

    <!-- Camper Door Outline & Handle -->
    <path d="M 215 248 L 215 352" stroke="#94a3b8" stroke-width="1.8" />
    <rect x="219" y="312" width="12" height="4" rx="2" fill="#334155" />

    <!-- Headlight (Glowing warm camping LED) -->
    <path d="M 382 328 C 390 334, 390 342, 386 348 L 378 348 L 378 328 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Headlight Beam Cone -->
    <polygon points="388,332 455,320 458,368 386,346" fill="#fef08a" opacity="0.22" />

    <!-- WHEELS -->
    <!-- Rear Wheel Well & Tire -->
    <ellipse cx="160" cy="374" rx="30" ry="30" fill="#090d16" />
    <ellipse cx="160" cy="374" rx="26" ry="26" fill="#1e293b" />
    <circle cx="160" cy="374" r="16" fill="url(#rimGrad)" stroke="#64748b" stroke-width="2" />
    <circle cx="160" cy="374" r="5" fill="#0f172a" />
    <!-- Treads / rim lugs -->
    <circle cx="160" cy="364" r="2" fill="#f8fafc" />
    <circle cx="170" cy="374" r="2" fill="#f8fafc" />
    <circle cx="160" cy="384" r="2" fill="#f8fafc" />
    <circle cx="150" cy="374" r="2" fill="#f8fafc" />

    <!-- Front Wheel Well & Tire -->
    <ellipse cx="325" cy="374" rx="30" ry="30" fill="#090d16" />
    <ellipse cx="325" cy="374" rx="26" ry="26" fill="#1e293b" />
    <circle cx="325" cy="374" r="16" fill="url(#rimGrad)" stroke="#64748b" stroke-width="2" />
    <circle cx="325" cy="374" r="5" fill="#0f172a" />
    <!-- Treads / rim lugs -->
    <circle cx="325" cy="364" r="2" fill="#f8fafc" />
    <circle cx="335" cy="374" r="2" fill="#f8fafc" />
    <circle cx="325" cy="384" r="2" fill="#f8fafc" />
    <circle cx="315" cy="374" r="2" fill="#f8fafc" />
  </g>

  <!-- FOREGROUND PACKED BACKPACK (Tangible Gear Motif) -->
  <g transform="translate(372, 345) scale(0.92)" filter="url(#dropShadow)">
    <!-- Backpack Ground Shadow -->
    <ellipse cx="25" cy="72" rx="28" ry="7" fill="#05140b" opacity="0.6" />

    <!-- Top rolled green sleeping mat -->
    <rect x="0" y="2" width="50" height="15" rx="7" fill="#15803d" stroke="#166534" stroke-width="1.5" />
    <ellipse cx="49" cy="9" rx="3.5" ry="7" fill="#14532d" />
    <line x1="12" y1="2" x2="12" y2="17" stroke="#000" stroke-width="1.8" opacity="0.5" />
    <line x1="38" y1="2" x2="38" y2="17" stroke="#000" stroke-width="1.8" opacity="0.5" />

    <!-- Main Pack Body -->
    <rect x="6" y="14" width="38" height="52" rx="10" fill="url(#packGrad)" stroke="#9a3412" stroke-width="2" />

    <!-- Top Flap -->
    <path d="M 6 18 Q 25 28 44 18 L 42 34 Q 25 38 8 34 Z" fill="#ea580c" stroke="#7c2d12" stroke-width="1.5" />

    <!-- Front Zipper Pocket -->
    <rect x="12" y="40" width="26" height="22" rx="5" fill="#c2410c" stroke="#7c2d12" stroke-width="1.5" />
    <line x1="14" y1="44" x2="36" y2="44" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" />

    <!-- Buckles and Straps -->
    <line x1="16" y1="26" x2="16" y2="52" stroke="#431407" stroke-width="2" />
    <line x1="34" y1="26" x2="34" y2="52" stroke="#431407" stroke-width="2" />
    <rect x="14" y="36" width="4" height="5" rx="1" fill="#fde047" />
    <rect x="32" y="36" width="4" height="5" rx="1" fill="#fde047" />

    <!-- Side Water Bottle -->
    <rect x="41" y="36" width="9" height="20" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2" />
    <rect x="43" y="32" width="5" height="4" rx="1" fill="#0369a1" />
  </g>

  <!-- Polished Gold Badge Rim for App Store / Home Screen Pop -->
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.65" />
</svg>